[project]
name = "price-comparator-tracker"
dynamic = ["version"]
description = "电商商品价格自动化采集与对比工具，支持京东/淘宝/拼多多多平台，含性价比推荐和历史趋势"
requires-python = ">=3.10"
readme = "README.md"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM", "TCH", "PTH", "PL", "RUF", "S",
]
ignore = [
    "S101",     # assert in tests
    "S603",     # subprocess intentional
    "S607",     # partial paths
    "PLR0913",  # data class constructors may have many params
    "PLR2004",  # price thresholds as magic values
    "B324",     # MD5 used for non-security hashing (product ID)
]

[tool.ruff.lint.isort]
known-first-party = ["core", "scrapers", "config"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
